name: Validate application and Firestore rules

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Compile Firestore rules in emulator
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-hcsmp "node -e \"console.log('Firestore emulator started')\""
